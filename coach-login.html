<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Login | Simha Cricket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card instructor-card">
    <div class="auth-heading"><h1>Instructor Login</h1><a class="back" href="index.html">Back</a></div>
    <p class="description">Access academy match and training information.</p>
    <form id="loginForm">
      <label for="email">Email<input id="email" type="email" placeholder="coach@simhaacademy.com" required></label>
      <label for="password">Password<input id="password" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Enter numeric password" required></label>
      <div class="demo">Demo login: coach@simhaacademy.com / 123456</div>
      <button type="submit">Login as Instructor</button>
      <div id="message" role="status"></div>
    </form>
    <section id="instructorDashboard" class="instructor-dashboard" hidden>
      <section class="dashboard-section">
        <h3>Visitors logged in</h3>
        <p class="dashboard-note">Everyone who completed the visitor OTP check on this browser.</p>
        <ul id="visitorsList" class="visitor-list"></ul>
      </section>
      <section class="dashboard-section">
        <h3>Upcoming matches</h3>
        <p class="dashboard-note">Add, edit, or delete matches and their Maps links.</p>
        <ul id="managedMatches" class="managed-matches"></ul>
        <form id="matchManagerForm" class="score-form">
          <label for="managedMatchGroup">Group or match name<input id="managedMatchGroup" type="text" required></label>
          <div class="score-fields">
            <label for="managedMatchDate">Date<input id="managedMatchDate" type="date" required></label>
            <label for="managedMatchTime">Time<input id="managedMatchTime" type="time" required></label>
            <label for="managedMatchMaps">Maps link<input id="managedMatchMaps" type="url" placeholder="https://maps.google.com/"></label>
          </div>
          <button type="submit">Add upcoming match</button>
          <div id="matchManagerMessage" role="status"></div>
        </form>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
