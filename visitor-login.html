<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Simha Cricket Academy</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
  <main class="auth-card visitor-card">
    <a class="brand auth-brand" href="visitor-login.html">
      <span class="mark">🏏</span><span><strong>Simha Cricket</strong><small>Academy</small></span>
    </a>
    <div id="visitorStep">
      <p class="eyebrow">Welcome to the academy</p>
      <h1>Enter your details to continue.</h1>
      <p class="description">We will use your phone number to verify your visit before showing the academy page.</p>
      <form id="visitorForm">
        <label for="visitorName">Your name<input id="visitorName" type="text" autocomplete="name" placeholder="Enter your name" required></label>
        <label for="visitorPhone">Phone number<input id="visitorPhone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="Enter your phone number" pattern="[0-9]{10}" maxlength="10" required></label>
        <button type="submit">Get OTP</button>
        <div id="visitorMessage" role="status"></div>
      </form>
    </div>
    <div id="otpStep" hidden>
      <p class="eyebrow">One-time verification</p>
      <h1>Enter your OTP.</h1>
      <p id="phoneSummary" class="description"></p>
      <form id="otpForm">
        <label for="otp">6-digit OTP<input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Enter OTP" required></label>
        <div id="demoOtp" class="demo" role="status"></div>
        <button type="submit">Verify and continue</button>
        <div id="otpMessage" role="status"></div>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
