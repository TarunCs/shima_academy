<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Simha Cricket Academy</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
    <header class="auth-header">
        <div class="auth-header-inner">
            <a class="brand" href="index.html">
                <span class="brand-icon">🏏</span>
                <span class="brand-text">
                    <strong>SIMHA CRICKET</strong>
                    <small>ACADEMY</small>
                </span>
            </a>
            <button id="darkModeToggle" class="dark-toggle" aria-label="Toggle Dark Mode">🌙</button>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card glass-card">

            <!-- Step 1: Name + Phone -->
            <div id="visitorStep">
                <h1 class="auth-title">Welcome To The Academy</h1>
                <p class="auth-desc">Enter Your Name And Phone Number To Continue.</p>

                <form id="visitorForm">
                    <div class="form-group">
                        <label for="visitorName">Full Name</label>
                        <input id="visitorName" type="text" placeholder="e.g. Ravi Kumar" required />
                    </div>
                    <div class="form-group">
                        <label for="visitorPhone">Phone Number</label>
                        <input id="visitorPhone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="e.g. 9876543210" required />
                    </div>
                    <button class="btn btn-primary" type="submit">Continue</button>
                    <div id="formMessage" class="status-msg"></div>
                </form>

                <!-- Instructor Login shortcut -->
                <div class="instructor-shortcut">
                    <span>Are you a coach?</span>
                    <a href="coach-login.html" class="instructor-link">Instructor Login →</a>
                </div>
            </div>

            <!-- Step 2: OTP -->
            <div id="otpStep" hidden>
                <h1 class="auth-title">Verify Your Phone</h1>
                <p class="auth-desc" id="phoneSummary">We Generated A One-Time Code For Your Phone.</p>

                <div class="demo-box" id="demoOtp">Demo OTP: 863254</div>

                <form id="otpForm">
                    <div class="form-group">
                        <label for="otp">Enter OTP</label>
                        <input id="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-Digit Code" required />
                    </div>
                    <button class="btn btn-primary" type="submit">Verify &amp; Enter Academy</button>
                    <div id="otpMessage" class="status-msg"></div>
                </form>

                <div class="back-row">
                    <button class="btn btn-secondary btn-small" id="backToVisitorBtn" type="button">← Go Back</button>
                </div>

                <!-- Instructor Login shortcut (also on OTP step) -->
                <div class="instructor-shortcut">
                    <span>Are you a coach?</span>
                    <a href="coach-login.html" class="instructor-link">Instructor Login →</a>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
